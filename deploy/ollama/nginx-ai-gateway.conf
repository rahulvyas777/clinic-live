# Only for the case where the model runtime runs on a DIFFERENT machine from ClinicLive.
# On the same box, nothing crosses the network and this file is not used.
#
# TLS: certbot --nginx -d ai.clinic.example  (same as the site)
# Key: generate once (openssl rand -hex 32), put it in the application's server-side
#      configuration under Ai:GatewayKey, never in the repo.

server {
    listen 443 ssl;
    server_name ai.clinic.example;

    ssl_certificate     /etc/letsencrypt/live/ai.clinic.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.clinic.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Reject anything without the shared key before it reaches the runtime.
    if ($http_x_ai_key != "REPLACE_WITH_THE_KEY") {
        return 401;
    }

    location / {
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;     # a long answer on a slow model
        proxy_buffering off;         # streamed tokens arrive as produced
        client_max_body_size 2m;
    }
}

server {
    listen 80;
    server_name ai.clinic.example;
    return 301 https://$host$request_uri;
}
