services:
  db:
    # Season four, Part 6: knowledge chunks store a vector(768) column, so the
    # engine needs pgvector. Same PostgreSQL 18, same data layout, same port.
    image: pgvector/pgvector:pg18
    container_name: cliniclive-pg
    environment:
      POSTGRES_USER: cliniclive
      POSTGRES_PASSWORD: cliniclive
      POSTGRES_DB: cliniclive
    ports:
      - "5499:5432"
    volumes:
      # postgres:18 images keep data in a major-version subdirectory
      # (/var/lib/postgresql/18/docker), so the volume mounts one level up.
      # Mounting at /var/lib/postgresql/data — the pre-18 habit — makes the
      # container refuse to start.
      - cliniclive-pgdata:/var/lib/postgresql

volumes:
  cliniclive-pgdata:
